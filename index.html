<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="app-version" content="25">
<title>Video-Kacheln</title>
<style>
  :root {
    --bg: #12151b;
    --surface: #1b2029;
    --surface-2: #252c38;
    --text: #eceff4;
    --muted: #9aa4b5;
    --accent: #f0a35e;
    --accent-ink: #1a1208;
    --danger: #ff8a80;
    --img: #6bb5ff;
    --img-ink: #06182b;
    --folder: #3fae6a;
    --folder-ink: #06210f;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f4f7;
      --surface: #ffffff;
      --surface-2: #e4e7ee;
      --text: #181c24;
      --muted: #596273;
      --accent: #b85f0f;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --img: #1a64c0;
      --img-ink: #ffffff;
      --folder: #1f7a45;
      --folder-ink: #ffffff;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .01em; }
  #count { color: var(--muted); font-size: .9rem; }
  .spacer { flex: 1 1 0; }
  .btn {
    appearance: none; border: 1px solid var(--surface-2); background: var(--surface); color: var(--text);
    font: inherit; font-size: .9rem; padding: 8px 12px; border-radius: 10px; cursor: pointer; min-height: 40px;
  }
  .btn:focus-visible, .tile:focus-visible, .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--surface-2); border-radius: 10px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: var(--surface); color: var(--muted); font: inherit; font-size: .9rem;
    padding: 8px 12px; min-height: 40px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  #pathbar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; min-width: 0; }
  #crumb { color: var(--muted); font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ver { color: var(--muted); font-size: .72rem; text-align: center; margin: 22px 0 0; }
  #hint { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  #status { margin: 28px 0; }
  #status p { margin: 0 0 12px; }
  #status .err { color: var(--danger); }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .tile {
    position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: var(--surface);
    border: 1px solid var(--surface-2); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 2rem; }
  .tile .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 9px;
    background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
    color: #fff; pointer-events: none;
  }
  .tile .name { font-size: .85rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .tile .meta { font-size: .72rem; opacity: .8; margin-top: 2px; }
  .tile.folder { background: var(--surface-2); }
  .tile.folder .ph { color: var(--accent); }
  .tile[aria-selected="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tile .playbtn {
    position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-ink); font-size: 1rem; display: none; place-items: center; cursor: pointer;
  }
  .tile[aria-selected="true"] .playbtn { display: grid; }
  .tile .kindtag {
    position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 999px; pointer-events: none;
    font-size: .68rem; font-weight: 700; letter-spacing: .06em; line-height: 1.3;
    box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }
  .tile .kindtag.video { background: var(--accent); color: var(--accent-ink); }
  .tile .kindtag.image { background: var(--img); color: var(--img-ink); }
  .tile.folder.hascover { border: 3px solid var(--folder); }
  .tile .foldertag {
    position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 5px; padding: 4px 11px 5px 8px;
    border-radius: 0 0 12px 0; background: var(--folder); color: var(--folder-ink); pointer-events: none;
    font-size: .68rem; font-weight: 700; letter-spacing: .06em; line-height: 1.3;
  }
  .tile .foldertag svg { width: 15px; height: 15px; stroke-width: 4; }
  #player { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; }
  #player .bar {
    display: flex; align-items: center; gap: 12px; color: #fff;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
  }
  #player .title { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .95rem; }
  #player .close { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
  #player img { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  #player .nav {
    display: flex; gap: 12px;
    padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  #player .nav button {
    flex: 1 1 0; min-height: 56px; font-size: 1.8rem; line-height: 1;
    background: rgba(255,255,255,.14); color: #fff; border-color: transparent;
  }
  #player .nav #pthumb, #player .nav #pfolder { flex: 2 1 0; font-size: .85rem; font-weight: 600; line-height: 1.2; }
  #player .fine { padding: 4px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); color: #fff; }
  #player .fine .time { font-size: .85rem; text-align: center; font-variant-numeric: tabular-nums; opacity: .9; }
  #player .fine input[type="range"] { width: 100%; height: 40px; margin: 0; accent-color: var(--accent); touch-action: none; }
  #player .fine .btns { display: flex; gap: 8px; }
  #player .fine .btns button {
    flex: 1 1 0; min-height: 48px; font-size: .95rem; font-weight: 600;
    background: rgba(255,255,255,.14); color: #fff; border-color: transparent; touch-action: manipulation;
  }
  @media (max-height: 480px) {
    #player .fine .btns button { min-height: 38px; }
    #player .nav button { min-height: 44px; }
  }
  #player .nav button:disabled { opacity: .3; cursor: default; }
  #player .pbar { height: 12px; margin-top: 8px; border-radius: 6px; background: rgba(255,255,255,.2); overflow: hidden; }
  #player .pbar > div { height: 100%; width: 0; background: var(--accent); }
  #player .pbar.indet > div { width: 35%; animation: pbar-run 1.1s ease-in-out infinite alternate; }
  @keyframes pbar-run { from { margin-left: 0; } to { margin-left: 65%; } }
  #player .msg.err div { margin: 0 0 6px; }
  #player video { flex: 1 1 0; min-height: 0; width: 100%; background: #000; }
  #player .msg { color: #fff; padding: 0 16px 16px; font-size: .9rem; }
  #player .msg.err { color: #ff9c93; }
  #gate { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; padding: 20px; }
  #gate form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
  #gate .info {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px;
    font-size: .72rem; line-height: 1.4; color: var(--muted);
  }
  #gate .info ul { margin: 4px 0 0; padding-left: 1.1em; }
  #gate h2 { margin: 0; font-size: 1.1rem; }
  #gate input {
    font: inherit; font-size: 1.4rem; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 10px;
    border: 1px solid var(--surface-2); background: var(--surface); color: var(--text); width: 100%;
  }
  #gate input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #gate .err { color: var(--danger); margin: 0; min-height: 1.4em; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>Video-Kacheln</h1>
  <span id="count"></span>
  <span class="spacer"></span>
  <div class="seg" id="sort" role="group" aria-label="Sortierung" hidden>
    <button type="button" data-sort="name" aria-pressed="true">Name</button>
    <button type="button" data-sort="date" aria-pressed="false">Datum</button>
    <button type="button" data-sort="size" aria-pressed="false">Größe</button>
  </div>
  <button class="btn" id="reload" type="button" hidden>Aktualisieren</button>
  <button class="btn" id="logout" type="button" hidden>Abmelden</button>
</header>

<div id="pathbar" hidden>
  <button class="btn" id="back" type="button" hidden>&larr; Zurück</button>
  <span id="crumb"></span>
</div>
<p id="hint" hidden>Tippen öffnet einen Ordner, spielt ein Video ab oder zeigt ein Bild. Im Player blättern die Pfeile unten.</p>
<div id="status"></div>
<div id="grid" role="listbox" aria-label="Inhalt"></div>
<p id="ver"></p>

<div id="player" hidden>
  <div class="bar">
    <div class="title" id="ptitle"></div>
    <button class="btn close" id="pclose" type="button">Schließen</button>
  </div>
  <video id="pvideo" controls playsinline></video>
  <img id="pimg" alt="" hidden>
  <div class="msg" id="pmsg" hidden></div>
  <div class="fine" id="pfine" hidden>
    <div class="time" id="ptime"></div>
    <input id="pslider" type="range" min="-5" max="5" step="0.01" value="0" aria-label="Feinsuche: 5 Sekunden zurück bis 5 Sekunden vor">
    <div class="btns">
      <button class="btn" id="pm1s" type="button" aria-label="1 Sekunde zurück">&minus;1 s</button>
      <button class="btn" id="pmf" type="button" aria-label="1 Bild zurück">&#9666; Bild</button>
      <button class="btn" id="ppf" type="button" aria-label="1 Bild vor">Bild &#9656;</button>
      <button class="btn" id="pp1s" type="button" aria-label="1 Sekunde vor">+1 s</button>
    </div>
  </div>
  <div class="nav">
    <button class="btn" id="pprev" type="button" aria-label="Vorheriges">&#8249;</button>
    <button class="btn" id="pthumb" type="button" hidden>Als Vorschaubild</button>
    <button class="btn" id="pfolder" type="button" hidden>Als Ordnerbild</button>
    <button class="btn" id="pnext" type="button" aria-label="Nächstes">&#8250;</button>
  </div>
</div>

<div id="gate" hidden>
  <div class="info" id="gateinfo"></div>
  <form id="gateform" autocomplete="off">
    <h2>Video-Kacheln</h2>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Zugangscode" placeholder="Code">
    <button class="btn primary" type="submit">Weiter</button>
    <p class="err" id="gateerr" role="alert"></p>
  </form>
</div>

<script src="./lib/msal-browser.min.js"></script>
<!-- Start-Prüfung: Bei jeder Änderung die Nummer in <meta name="app-version"> UND in version.json erhöhen.
     Ist die Seite im Zwischenspeicher veraltet, lädt sie sich beim Start selbst in der neuen Version. -->
<script>
(function () {
  var BUILD = document.querySelector('meta[name="app-version"]').content;
  var done = false;
  function go() {
    if (done) return;
    done = true;
    var s = document.createElement("script");
    s.src = "./app.js?v=" + BUILD;
    document.body.appendChild(s);
  }
  try {
    // Läuft gerade eine Microsoft-Anmeldung (Antwort im Adressteil nach #), nichts umleiten.
    if (/[#&](code|state|error)=/.test(location.hash || "")) return go();
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); go(); }, 3000);
    fetch("./version.json?t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer);
        if (done) return;
        var latest = String(j.version);
        if (/^\d+$/.test(latest) && latest !== BUILD) { // nur bei gültiger Nummer
          var tried = null;
          try { tried = sessionStorage.getItem("vk_reload"); } catch (_) {}
          if (tried !== latest) { // nur ein Versuch pro Version, damit keine Endlosschleife entsteht
            try { sessionStorage.setItem("vk_reload", latest); } catch (_) {}
            location.replace(location.pathname + "?v=" + latest + (location.hash || ""));
            return;
          }
        }
        go();
      })
      .catch(function () { clearTimeout(timer); go(); });
  } catch (_) { go(); }
})();
</script>
</body>
</html>
